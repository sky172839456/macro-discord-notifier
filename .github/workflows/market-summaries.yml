name: Daily and Weekly Market Summaries

on:
  workflow_dispatch:
    inputs:
      period:
        description: Summary to test
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly

permissions:
  contents: read

concurrency:
  group: market-summaries
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked runtime dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate or send summary
        env:
          DISCORD_DAILY_SUMMARY_WEBHOOK_URL: ${{ secrets.DISCORD_DAILY_SUMMARY_WEBHOOK_URL }}
          DISCORD_WEEKLY_SUMMARY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_SUMMARY_WEBHOOK_URL }}
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARKET_SUMMARY_TEST=1 \
            DISCORD_DAILY_SUMMARY_WEBHOOK_URL="$DISCORD_TEST_WEBHOOK_URL" \
            DISCORD_WEEKLY_SUMMARY_WEBHOOK_URL="$DISCORD_TEST_WEBHOOK_URL" \
              python summary_notifier.py --period "${{ inputs.period }}"
          fi
